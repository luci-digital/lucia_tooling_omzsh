# LDS: 600.432 | Infrastructure/AI — OpenShell policy for a toybox-based sandbox | Agent: security-sentinel,juniper
# ISO: ISO/IEC 42001 §8, ISO 27001 §A.9, A.13
# Genesis Bond: GB-2025-0524-DRH-LCS-001
# Created: 2026-10-02 · Updated: 2026-10-02
#
# Why this shape (see ../TOYBOX_REMAP.md §3): OpenShell binds network rules to the RESOLVED /proc/<pid>/exe.
# A multicall toybox would make every applet "/bin/toybox", so one allowed applet would allow them all.
# The sovereign image therefore ships the network-capable applets as SINGLE static binaries
# (toybox `make single`: wget, nc, host, ping) and keeps the multicall for the rest.
version: 1
process:
  run_as_user: sandbox
  run_as_group: sandbox
filesystem_policy:
  include_workdir: true
  read_only:
    - /bin            # -> /usr/bin (mkroot symlink): toybox multicall + singles
    - /usr
    - /lib
    - /etc
    - /proc
    - /dev/urandom
    - /opt/openshell   # supervisor + skills (mounted by the driver)
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
landlock:
  compatibility: best_effort
network_policies:
  luciverse_router:
    name: agent-mesh-router
    endpoints:
      - host: router.lucidigital.io        # UAL forward_auth in front; JWT nbf/exp per web2-agent-ingress §2
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - { path: /usr/bin/wget }             # single-applet static wget, not the multicall
      - { path: /usr/bin/curl }             # static curl (TLS lane) when present
  data_vault_sql:
    name: data-vault-engine
    endpoints:
      - host: mindsdb.lucidigital.io
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/bin/luajit }           # the Lua lane posts SQL directly (oasis-core/http.lua) when built with socket
  probes:
    name: port-probes
    endpoints:
      - host: 127.0.0.1
        port: 47334
        protocol: tcp
        enforcement: enforce
        access: read-only
    binaries:
      - { path: /usr/bin/nc }               # luci-probe.sh port_up only
# Deliberately absent: /bin/toybox, /bin/sh, /bin/bash — no shell gets network identity.
